name: checks

on:
  pull_request:
  push:
    branches: [main]
    paths: ['**.py', 'sources.json', '.github/workflows/checks.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests.py
