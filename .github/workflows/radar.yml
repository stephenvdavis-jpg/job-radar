name: Daily job radar

on:
  schedule:
    # 11:00 UTC = 7:00 AM Eastern (during daylight saving time)
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar
        run: python3 radar.py run

      - name: Commit updated data and digest
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ digests/ docs/
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Radar run $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
